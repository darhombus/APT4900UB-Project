name: Migrate hosted database

on:
  # Auto-run when migration files land on staging or main.
  push:
    branches: [staging, main]
    paths:
      - 'supabase/migrations/**'
  # Manual trigger — used to bootstrap the hosted database the first time
  # (when the migrations already exist on every branch, no push changes them),
  # and to re-run on demand.
  workflow_dispatch:

# Never cancel an in-flight migration.
concurrency:
  group: migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # PINNED. This was `latest`, and on 2026-08-08 that broke the deploy
          # with no commit on our side: `supabase link` started failing with
          #   failed to get api keys: SchemaError(Expected a string matching the
          #   RegExp ^...T...Z$ at [2]["inserted_at"])
          # i.e. the CLI rejecting the timestamp format the platform returns for
          # the third API key. v2.112.0 published 2026-08-07T10:08Z, between the
          # last green run (2026-08-05T20:50Z) and the failure.
          #
          # A tool in the deploy path that upgrades itself is a hazard, not a
          # convenience: this workflow's behaviour must change only when someone
          # changes it. Upgrades are a deliberate commit — bump this, watch a run
          # go green, keep it.
          version: 2.111.0

      - name: Link the hosted project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Push migrations (idempotent — applies only unseen migrations)
        run: supabase db push
