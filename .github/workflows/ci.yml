name: CI

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev]

# One run per ref; a newer push cancels an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # Placeholder values so `svelte-kit sync` generates the $env/static/public
      # and $env/static/private ambient types, letting svelte-check and the build
      # resolve every env import (notably src/lib/server/env.ts). CI only compiles
      # the app; it never connects to Supabase, so these need only be non-empty.
      PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      PUBLIC_SUPABASE_ANON_KEY: sb_publishable_placeholder
      PUBLIC_PAYSTACK_PUBLIC_KEY: pk_test_placeholder
      PUBLIC_APP_URL: http://localhost:5173
      SUPABASE_SERVICE_ROLE_KEY: sb_secret_placeholder
      PAYSTACK_SECRET_KEY: placeholder
      INNGEST_EVENT_KEY: placeholder
      INNGEST_SIGNING_KEY: placeholder
      AT_API_KEY: placeholder
      AT_USERNAME: sandbox
      RESEND_API_KEY: placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (prettier + eslint)
        run: npm run lint

      - name: Type-check (svelte-check)
        run: npm run check

      - name: Build
        run: npm run build
