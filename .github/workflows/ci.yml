name: CI

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev]

# One run per ref; a newer push cancels an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # Placeholder PUBLIC_ values so `svelte-kit sync`, `svelte-check`, and the
      # build can resolve $env/static/public. CI only compiles the app; it never
      # connects to Supabase, so these need only be non-empty.
      PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      PUBLIC_SUPABASE_ANON_KEY: sb_publishable_placeholder
      PUBLIC_APP_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (prettier + eslint)
        run: npm run lint

      - name: Type-check (svelte-check)
        run: npm run check

      - name: Test (passes if no tests exist yet)
        run: npm run test -- --passWithNoTests

      - name: Build
        run: npm run build
